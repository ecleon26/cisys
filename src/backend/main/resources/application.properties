quarkus.http.port=8080
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CISYS_CORS_ORIGINS:http://localhost:5173,http://localhost:8180}
# Let the browser read the log-range and rate-limit headers on cross-origin requests.
quarkus.http.cors.exposed-headers=X-Log-Size,X-Log-Offset,X-Log-Length,Retry-After
quarkus.oidc.auth-server-url=${KEYCLOAK_URL:http://localhost:8180}/realms/cisys
quarkus.oidc.client-id=cisys-ui
quarkus.oidc.application-type=service
quarkus.oidc.roles.role-claim-path=realm_access/roles
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:cisys}
quarkus.datasource.password=${DB_PASSWORD:cisys}
# Tests get their own PostgreSQL from Quarkus Dev Services, so the URL is only set outside the test profile.
%dev,prod.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/cisys}
# The schema is owned by Flyway (src/backend/main/resources/db/migration); Hibernate only validates it.
# Databases created before migrations existed are baselined at version 0, so the repeatable R__schema.sql still runs.
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.baseline-version=0
# Databases that applied the former V1__baseline.sql still record it; it is now part of R__schema.sql.
quarkus.flyway.ignore-migration-patterns=*:missing,*:future
quarkus.hibernate-orm.schema-management.strategy=validate
# Audit details are a JSON column. Hibernate's JSON mapping uses its own ObjectMapper; the REST
# ObjectMapper is customized (dates, not timestamps), so use the plain built-in format instead.
quarkus.hibernate-orm.mapping.format.global=ignore
# Clients may omit boolean fields, such as privateRepository; Jackson 3 would answer 400 by default.
quarkus.jackson.fail-on-null-for-primitives=false

# Use the immutable Keycloak subject rather than preferred_username for ownership.
quarkus.oidc.token.principal-claim=sub
quarkus.oidc.roles.source=accesstoken

# Sign everyone out when the application shuts down, using a service account with the manage-users role.
cisys.session.invalidate-on-shutdown=${SESSION_INVALIDATE_ON_SHUTDOWN:true}
cisys.keycloak.url=${KEYCLOAK_URL:http://localhost:8180}
cisys.keycloak.admin-client-id=${KEYCLOAK_ADMIN_CLIENT_ID:cisys-backend}
cisys.keycloak.admin-client-secret=${KEYCLOAK_ADMIN_CLIENT_SECRET:cisys}

# The runner is intended only for trusted code on a dedicated Linux host.
# It uses podman when it is installed, otherwise docker.

# How long the public front-page statistics are cached on the server, in seconds.
cisys.stats.cache-seconds=${STATS_CACHE_SECONDS:30}

# How long a computed build trend report is cached, in seconds; 0 recomputes on every request.
cisys.trends.cache-seconds=${TRENDS_CACHE_SECONDS:30}

# Anonymous access limits: bytes of one build log per response, and requests per client per window.
# A request limit of zero disables the rate limiter.
cisys.public.log-max-bytes=${PUBLIC_LOG_MAX_BYTES:2097152}
cisys.public.rate-limit.requests=${PUBLIC_RATE_LIMIT_REQUESTS:120}
cisys.public.rate-limit.window-seconds=${PUBLIC_RATE_LIMIT_WINDOW_SECONDS:60}
cisys.public.rate-limit.max-clients=${PUBLIC_RATE_LIMIT_MAX_CLIENTS:10000}

# Safety limit for one build's stored output, in bytes; beyond it the build is marked truncated.
cisys.build.log-max-bytes=${BUILD_LOG_MAX_BYTES:1073741824}

# How often expired builds are deleted; admins set the limits under Settings > Retention.
cisys.retention.every=${BUILD_RETENTION_EVERY:1h}

# Automatic builds poll each project's repository on a timer: plain Git, no push hook and no
# provider API, so GitLab and private repositories work. Admins set on/off, granularity, branch
# scope and interval under Settings > Automatic builds.
cisys.poll.every=${POLL_EVERY:60s}
# How often the timer checks whether the interval has elapsed.
cisys.poll.tick=${POLL_TICK:10s}
# Safety net for one branch in one tick; the build queue limit is the real backpressure.
cisys.poll.max-commits=${POLL_MAX_COMMITS:1000}
# One bare mirror per project. Must not be under java.io.tmpdir, which holds build checkouts.
cisys.poll.mirror-dir=${POLL_MIRROR_DIR:${user.home}/.cisys/mirrors}
# Mirror size limit per project in MiB; 0 turns it off. Exceeding it stops that project's polling.
cisys.poll.mirror-max-mib=${POLL_MIRROR_MAX_MIB:4096}
# The files each project keeps between builds (Project settings > Cache). Must not be under
# java.io.tmpdir. A cache larger than the limit in MiB is not saved; 0 turns the limit off.
cisys.cache.dir=${CACHE_DIR:${user.home}/.cisys/cache}
cisys.cache.max-mib=${CACHE_MAX_MIB:2048}

# Repository access. Only these HTTPS hosts may be cloned, and every address they resolve to must
# be public unless the network is listed below. Add a local Git server to the hosts when needed.
cisys.git.allowed-hosts=${CISYS_GIT_ALLOWED_HOSTS:github.com,gitlab.com}
# Comma-separated ports that may be used. Leave 443 in the list.
cisys.git.allowed-ports=${CISYS_GIT_ALLOWED_PORTS:443}
# Comma-separated IPv4 or IPv6 CIDR ranges that may be fetched even though they are private.
cisys.git.allowed-networks=${CISYS_GIT_ALLOWED_NETWORKS:}
# Hosts whose certificate is accepted as is, for a local server with a self-signed certificate.
cisys.git.insecure-tls-hosts=${CISYS_GIT_INSECURE_TLS_HOSTS:}
# Base64-encoded 32-byte AES key for project Git tokens. Set CISYS_SECRET_KEY in the environment;
# leaving it empty keeps the server running but refuses to store a token until it is configured.
cisys.secret-key=${CISYS_SECRET_KEY:}

# Single backend runner. Limits must be positive; queue-limit counts waiting builds only.
cisys.build.concurrency=${BUILD_CONCURRENCY:1}
cisys.build.queue-limit=${BUILD_QUEUE_LIMIT:100}

# Health and metrics are served by the management interface, a separate HTTP server on port 9000:
# /health, /health/live, /health/ready and /metrics. It has no authentication by default and binds to
# 0.0.0.0 in a production build, so do not expose port 9000 to untrusted networks.
quarkus.management.enabled=true
quarkus.management.root-path=/
# The Health UI would appear on the management port in dev and test; keep it off.
quarkus.smallrye-health.ui.enabled=false

# Ports build steps may reach through the egress proxy, for the hosts admins allow under Settings > Network.
cisys.build.network.ports=${BUILD_NETWORK_PORTS:443}
# Limits for one repository checkout, in MiB and files. Both must be positive.
cisys.build.max-checkout-mib=${BUILD_MAX_CHECKOUT_MIB:1024}
cisys.build.max-checkout-files=${BUILD_MAX_CHECKOUT_FILES:100000}
# Limits for the artifacts one build stores, in MiB and files, until an admin sets them.
cisys.build.artifacts.max-mib=${BUILD_ARTIFACTS_MAX_MIB:100}
cisys.build.artifacts.max-files=${BUILD_ARTIFACTS_MAX_FILES:1000}
# Limits for one build container: memory in MiB, CPUs as whole cores, processes per build user.
cisys.build.max-memory-mib=${BUILD_MAX_MEMORY_MIB:1024}
cisys.build.max-cpus=${BUILD_MAX_CPUS:1}
cisys.build.max-pids=${BUILD_MAX_PIDS:512}
# Minutes one build's image build may take before it is stopped and reported as timed out.
cisys.build.timeout-minutes=${BUILD_TIMEOUT_MINUTES:10}

# Project webhooks (Project settings > Webhooks) post to any public HTTPS host unless hosts are
# listed here. Protected addresses stay blocked unless their network is listed explicitly.
cisys.webhooks.allowed-hosts=${CISYS_WEBHOOKS_ALLOWED_HOSTS:}
cisys.webhooks.allowed-ports=${CISYS_WEBHOOKS_ALLOWED_PORTS:443}
cisys.webhooks.allowed-networks=${CISYS_WEBHOOKS_ALLOWED_NETWORKS:}
# How often pending deliveries are sent and retried.
cisys.webhooks.every=${WEBHOOKS_EVERY:5s}
